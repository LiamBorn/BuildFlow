<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 170" width="300" height="170" fill="none">
  <!-- The Bookmarks page's banner picture (2026-09-28, the Dashboard's EduLearn design carried to
       the Bookmarks page): a stack of pages, the top one marked with a ribbon, and a star, in the
       Dashboard banner's pastel 3D. Decorative; the banner draws it as a background. -->
  <defs>
    <radialGradient id="bk-floor" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6f78e8" stop-opacity="0.26" />
      <stop offset="1" stop-color="#6f78e8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bk-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bk-back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9cdfb" />
      <stop offset="1" stop-color="#a9aef3" />
    </linearGradient>
    <linearGradient id="bk-page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#eef0ff" />
    </linearGradient>
    <linearGradient id="bk-ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c8ef8" />
      <stop offset="1" stop-color="#6a5fee" />
    </linearGradient>
    <linearGradient id="bk-star" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffe597" />
      <stop offset="0.55" stop-color="#fbbf3c" />
      <stop offset="1" stop-color="#ee9814" />
    </linearGradient>
  </defs>

  <circle cx="150" cy="86" r="86" fill="url(#bk-halo)" />
  <ellipse cx="150" cy="158" rx="126" ry="10" fill="url(#bk-floor)" />

  <!-- the stack of pages -->
  <rect x="104" y="30" width="116" height="118" rx="14" transform="rotate(-8 162 89)" fill="url(#bk-back)" />
  <rect x="100" y="28" width="116" height="118" rx="14" transform="rotate(5 158 87)" fill="#e3e6fd" />
  <rect x="96" y="24" width="116" height="122" rx="14" fill="url(#bk-page)" />
  <rect x="96" y="24" width="116" height="122" rx="14" stroke="#dfe3fd" stroke-width="1.5" />
  <rect x="110" y="40" width="24" height="24" rx="7" fill="#eaefff" />
  <path d="M116.5 52 L 120.5 56 L 128 47.5" stroke="#5566ee" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="142" y="42" width="40" height="6" rx="3" fill="#1c2260" opacity="0.8" />
  <rect x="142" y="54" width="28" height="5" rx="2.5" fill="#b8bee8" />
  <rect x="110" y="76" width="88" height="6" rx="3" fill="#dde2fd" />
  <rect x="110" y="89" width="72" height="6" rx="3" fill="#dde2fd" />
  <rect x="110" y="102" width="80" height="6" rx="3" fill="#dde2fd" />
  <rect x="110" y="120" width="36" height="12" rx="6" fill="#e1f7ef" />
  <rect x="152" y="120" width="30" height="12" rx="6" fill="#f1eafe" />

  <!-- the ribbon marking it -->
  <path d="M184 16 H 202 V 58 L 193 50.5 L 184 58 Z" fill="url(#bk-ribbon)" />
  <path d="M193 25.5 L 195 30.2 L 200 30.6 L 196.2 33.8 L 197.4 38.8 L 193 36.1 L 188.6 38.8 L 189.8 33.8 L 186 30.6 L 191 30.2 Z" fill="#ffffff" />

  <!-- the star, set down beside the stack -->
  <ellipse cx="58" cy="152" rx="30" ry="5" fill="#4f57cc" opacity="0.16" />
  <path d="M58 88 L 67.4 107.8 L 89 110.6 L 73.2 125.4 L 77.2 147 L 58 136.4 L 38.8 147 L 42.8 125.4 L 27 110.6 L 48.6 107.8 Z" fill="url(#bk-star)" />
  <path d="M58 99 L 63.6 111 L 51.5 109.6 Z" fill="#ffffff" opacity="0.45" />

  <!-- sparkles -->
  <path d="M242 42 L 244.6 49.4 L 252 52 L 244.6 54.6 L 242 62 L 239.4 54.6 L 232 52 L 239.4 49.4 Z" fill="#b8a9ff" />
  <path d="M252 104 L 253.4 108.1 L 257.5 109.5 L 253.4 110.9 L 252 115 L 250.6 110.9 L 246.5 109.5 L 250.6 108.1 Z" fill="#9fb3ff" />
  <path d="M74 44 L 75.4 48.1 L 79.5 49.5 L 75.4 50.9 L 74 55 L 72.6 50.9 L 68.5 49.5 L 72.6 48.1 Z" fill="#c4b8ff" />
  <circle cx="266" cy="78" r="2.5" fill="#c9bfff" />
  <circle cx="30" cy="70" r="2.5" fill="#a8c0ff" />
</svg>
