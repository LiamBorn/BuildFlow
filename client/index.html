<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>BuildFlow — Construction Scheduling &amp; Field Command Center</title>
    <meta
      name="description"
      content="BuildFlow is the command center for construction teams — coordinate crews, project phases, materials, field updates, and delayIQs in real time, all in one place."
    />
    <meta name="application-name" content="BuildFlow" />
    <meta name="author" content="BuildFlow" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical production domain — also used by the Open Graph / Twitter tags below. -->
    <link rel="canonical" href="https://buildflow.com/" />

    <!-- Theme color (matches the site's light/dark welcome chrome) -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F6F8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B0E14" />

    <!-- Icons / favicon -->
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <meta name="apple-mobile-web-app-title" content="BuildFlow" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph (Facebook, LinkedIn, Slack, iMessage, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BuildFlow" />
    <meta property="og:title" content="BuildFlow — Construction Scheduling &amp; Field Command Center" />
    <meta
      property="og:description"
      content="Coordinate crews, project phases, materials, field updates, and delayIQs in real time — all from one clean command center."
    />
    <meta property="og:url" content="https://buildflow.com/" />
    <meta property="og:image" content="https://buildflow.com/og-image.png" />
    <meta property="og:image:secure_url" content="https://buildflow.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="BuildFlow — run the whole jobsite from one command center" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BuildFlow — Construction Scheduling &amp; Field Command Center" />
    <meta
      name="twitter:description"
      content="Coordinate crews, project phases, materials, field updates, and delayIQs in real time — all from one clean command center."
    />
    <meta name="twitter:image" content="https://buildflow.com/og-image.png" />
    <meta name="twitter:image:alt" content="BuildFlow — run the whole jobsite from one command center" />
      <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
